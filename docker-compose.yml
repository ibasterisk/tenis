services:
  tenis:
    build: .
    container_name: ibasterisk-tenis
    restart: unless-stopped
    ports:
      - "${TENIS_BIND_IP:-127.0.0.1}:${TENIS_PORT:-3087}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
